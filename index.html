<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Research Tool</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        #navbar { height: 50px; background: #333; display: flex; align-items: center; padding: 0 15px; }
        #url-input { flex: 1; padding: 8px; border: none; border-radius: 4px; font-size: 14px; }
        #go-btn { margin-left: 10px; padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #view { width: 100%; height: calc(100% - 50px); border: none; }
    </style>
</head>
<body>

    <!-- 上部のURLバー（仕事のツールっぽく見せるデザイン） -->
    <div id="navbar">
        <input type="text" id="url-input" value="https://google.com" placeholder="URLまたは検索ワードを入力">
        <button id="go-btn" onclick="loadPage()">Go</button>
    </div>

    <!-- ページを表示する「窓（インラインフレーム）」 -->
    <iframe id="view" src="https://google.com"></iframe>

    <script>
        function loadPage() {
            var url = document.getElementById('url-input').value;
            // httpから始まっていなければ、Google検索として処理する
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://google.com&q=' + encodeURIComponent(url);
            }
            document.getElementById('view').src = url;
        }
        // Enterキーでも検索できるようにする
        document.getElementById('url-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { loadPage(); }
        });
    </script>

</body>
</html>
