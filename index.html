<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study Portal</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #f0f2f5; }
        #navbar { height: 55px; background: #1a1a1a; display: flex; align-items: center; padding: 0 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        #url-input { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 14px; background: #2a2a2a; color: white; margin-right: 10px; }
        #url-input::placeholder { color: #aaa; }
        #go-btn { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #go-btn:hover { background: #0056b3; }
        #view { width: 100%; height: calc(100% - 55px); border: none; background: white; }
    </style>
</head>
<body>

    <!-- 上部のアドレスバー（ここに検索ワードやURLを入れます） -->
    <div id="navbar">
        <input type="text" id="url-input" value="https://google.com" placeholder="検索キーワード、またはURL（https://...）を入力">
        <button id="go-btn" onclick="loadPage()">Go</button>
    </div>

    <!-- ページを表示するメイン画面 -->
    <iframe id="view" src=""></iframe>

    <script>
        function loadPage() {
            var input = document.getElementById('url-input').value.trim();
            if (!input) return;

            var targetUrl = input;
            // URLの形（http...）になっていない場合はGoogle検索にする
            if (!input.startsWith('http://') && !input.startsWith('https://')) {
                targetUrl = 'https://google.com' + encodeURIComponent(input);
            }

            // 【重要】接続拒否（X-Frame-Options）を回避する無料プロキシサーバーを経由させる
            // これにより、Googleや各種サイトが画面内に正常に表示されるようになります
            var proxyUrl = 'https://allorigins.win' + encodeURIComponent(targetUrl);
            
            // もし上記で動かないサイトがある場合用の第2候補（コメントアウトを外して切り替え可能）
            // var proxyUrl = 'https://corsproxy.io?' + encodeURIComponent(targetUrl);

            document.getElementById('view').src = proxyUrl;
        }

        // ページ読み込み時に初期画面（Google）をプロキシ経由で開く
        window.onload = function() {
            loadPage();
        };

        // Enterキーでも起動できるようにする
        document.getElementById('url-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { loadPage(); }
        });
    </script>

</body>
</html>
